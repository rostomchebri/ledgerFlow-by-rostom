# OPS-01 — production topology on a single VPS (Docker Compose).
#
# 1. Copy `.env.production.example` to `.env.production` and fill in secrets.
# 2. Put a TLS-terminating reverse proxy (Caddy/nginx/Traefik) in front of
#    `web:3000`; never expose PostgreSQL or MinIO to the internet.
# 3. docker compose -f docker/compose.prod.yml --env-file .env.production up -d --build
#
# The migrate service is a one-shot job; web and worker only start after it
# exits successfully.

name: ledgerflow

x-app-env: &app-env
  NODE_ENV: production
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  JOBS_SCHEMA: ${JOBS_SCHEMA:-pgboss}
  REMINDER_CRON: ${REMINDER_CRON:-0 6 * * *}
  REMINDER_TIMEZONE: ${REMINDER_TIMEZONE:-Africa/Algiers}
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-auto}
  EMAIL_FROM: ${EMAIL_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    # Bind to loopback only: the app reaches it over the compose network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-ledgerflow}"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-init:
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 2;
      done;
      aws --endpoint-url http://minio:9000 s3 mb s3://${S3_BUCKET} || true;
      echo 'bucket ready';
      "

  migrate:
    build:
      context: ..
      target: migrator
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      target: runner
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: ..
      target: worker
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
