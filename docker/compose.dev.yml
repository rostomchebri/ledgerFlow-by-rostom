services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
      POSTGRES_DB: ledgerflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO's official images were removed from Docker Hub; pgsty/minio is a
  # maintained community mirror of the same server.
  minio:
    image: pgsty/minio:latest
    container_name: ledgerflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ledgerflow
      MINIO_ROOT_PASSWORD: ledgerflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: amazon/aws-cli:latest
    container_name: ledgerflow-minio-init
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ledgerflow
      AWS_SECRET_ACCESS_KEY: ledgerflow-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 2;
      done;
      aws --endpoint-url http://minio:9000 s3 mb s3://ledgerflow-dev || true;
      echo 'bucket ready';
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: ledgerflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
